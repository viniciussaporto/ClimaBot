# ClimaBot stack: the bot, its MongoDB, and two challenge-solving browsers
# (FlareSolverr/Chrome and Byparr/Firefox) used to load shop pages behind bot
# protection.
#
# Networks:
#   default     – internet access for the bot (Discord, weather APIs, shops)
#   db          – internal only: bot <-> MongoDB (Mongo has no other access)
#   scraper     – bot <-> FlareSolverr/Byparr; the browsers get internet
#                 access but cannot reach MongoDB or the monitoring stack
#   monitoring  – shared with the monitoring stack (Prometheus scrapes
#                 climabot:9464; Grafana, Mimir, Loki are reachable).
#                 Create it once with: docker network create climabot-monitoring
name: climabot

services:
  climabot:
    image: climabot:rust
    build: .
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: climabot
      FLARESOLVERR_URL: http://flaresolverr:8191
      BYPARR_URL: http://byparr:8191
    ports:
      - "127.0.0.1:${METRICS_HOST_PORT:-9465}:9464"   # Prometheus /metrics
    volumes:
      # Daily JSON log files on the host, where Alloy (website stack) ships
      # them to Loki for Grafana. Must be writable by uid 10001; `climabot`
      # (deploy/climabot) takes care of that.
      - ${CLIMABOT_LOG_DIR:-/var/log/climabot}:/var/log/climabot
    networks:
      - default
      - db
      - scraper
      - monitoring
    depends_on:
      mongo:
        condition: service_healthy
      flaresolverr:
        condition: service_started
      byparr:
        condition: service_started
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      LOG_LEVEL: info
      TZ: UTC
    networks:
      - scraper
    # Each page load runs a Chrome instance; keep it from starving the host.
    mem_limit: ${FLARESOLVERR_MEM_LIMIT:-1g}
    # Docker's default 64 MB /dev/shm crashes browsers on heavy pages.
    shm_size: 512m
    restart: unless-stopped

  # Same API as FlareSolverr, but Firefox-based (Camoufox): passes Cloudflare
  # challenges FlareSolverr times out on. Tried after FlareSolverr.
  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    networks:
      - scraper
    mem_limit: ${BYPARR_MEM_LIMIT:-1g}
    shm_size: 512m
    restart: unless-stopped

  mongo:
    image: mongo:8
    # Cap the WiredTiger cache; the default is half of the host's RAM.
    command: ["--wiredTigerCacheSizeGB", "${MONGO_CACHE_GB:-0.25}"]
    volumes:
      - mongo_data:/data/db
    networks:
      - db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

networks:
  default: {}
  db:
    internal: true
  scraper: {}
  monitoring:
    name: ${MONITORING_NETWORK:-climabot-monitoring}
    external: true

volumes:
  mongo_data:

[package]
name = "climabot"
version = "1.0.0"
edition = "2024"
description = "A Revolt.chat bot with weather, roles, and price tracking"
license = "MIT"

[[bin]]
name = "climabot"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# WebSocket (Revolt Gateway)
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = { version = "0.3", features = ["sink", "std"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Environment variables
dotenv = "0.15"

# Database
mongodb = { version = "3", features = ["tokio-runtime"] }

# Cron jobs
tokio-cron-scheduler = "0.10"

# Web scraping
scraper = "0.22"

# Metrics
prometheus = "0.13"
axum = { version = "0.8", features = ["http1", "tokio"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
once_cell = "1"
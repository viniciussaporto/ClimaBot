[package]
name = "climabot"
version = "1.0.0"
edition = "2021"
description = "A Revolt.chat bot with weather, roles, and price tracking"
license = "MIT"

[[bin]]
name = "climabot"
path = "src/main.rs"

[dependencies]
# --- Version Pinning to fix Edition 2024 / getrandom issues ---
time = "=0.3.36"
time-core = "=0.1.2"
getrandom = "=0.2.15"

# --- Async runtime ---
tokio = { version = "1", features = ["full"] }

# --- WebSocket (Revolt Gateway) ---
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = { version = "0.3", features = ["sink", "std"] }

# --- HTTP client (REST API + weather/geocoding) ---
reqwest = { version = "0.11", features = ["json"] }

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Environment variables ---
dotenv = "0.15"

# --- Database ---
mongodb = { version = "2.8", features = ["tokio-runtime"] }

# --- Cron jobs ---
tokio-cron-scheduler = "0.9"

# --- Web scraping ---
scraper = "0.19"

# --- Metrics (Prometheus) ---
prometheus = "0.13"
axum = { version = "0.7", features = ["http1", "tokio"] }

# --- Logging ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# --- Utilities ---
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
once_cell = "1"
[package]
name = "climabot"
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
description = "A Discord bot with weather, self-assignable roles, and price tracking"
license = "MIT"

[[bin]]
name = "climabot"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync"] }

# Discord API (gateway + REST). native-tls (OpenSSL) rather than rustls: serenity
# 0.12 pins tokio-tungstenite 0.21, whose rustls 0.22 / rustls-webpki 0.102 have
# open advisories (RUSTSEC-2026-0049/0098/0099/0104)
serenity = { version = "0.12.5", default-features = false, features = [
    "builder",
    "chrono",
    "client",
    "gateway",
    "http",
    "model",
    "utils",
    "native_tls_backend",
] }

# HTTP client (same major version and TLS backend serenity uses, so it is only compiled once)
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "native-tls", "socks", "cookies"] }
url = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Environment variables
dotenvy = "0.15"

# Database for price tracking
mongodb = "3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
fastrand = "2"

# Web scraping
scraper = "0.27"

# Metrics
prometheus = { version = "0.14", default-features = false, features = ["process"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2.5"

# Utilities
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"

[profile.release]
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

# The previous TypeScript/discord.js bot, kept runnable as a fallback.
# Installed to /root/climabot-js by deploy/install.sh and managed with
# `climabot start-javascript`. Builds from the DeployThis checkout.
#
# Joins the same monitoring network as the Rust bot under the same name
# (`climabot`), so Prometheus scrapes whichever bot is running.
name: climabot-js

services:
  climabot:
    image: climabot:javascript
    build:
      context: ${CLIMABOT_JS_SRC_DIR:-/root/ClimaBot}
      dockerfile: dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:9465:9464"   # Prometheus /metrics
    volumes:
      # `npm start` compiles into dist/ on every start.
      - ${CLIMABOT_JS_SRC_DIR:-/root/ClimaBot}/dist:/usr/src/app/dist
      # The TS logger writes /var/log/climabot.log.* on the host.
      - /var/log:/var/log
    networks:
      - default
      - monitoring
    restart: unless-stopped

networks:
  monitoring:
    name: ${MONITORING_NETWORK:-climabot-monitoring}
    external: true

          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "ced6krlr4hgxsb",
              "model": {
                "refId": "A",
                "expr": "up{job=~\"cadvisor|blackbox\"} < 1 or (label_replace(vector(1), \"name\", \"monitoring-cadvisor-1\", \"\", \"\") or label_replace(vector(1), \"name\", \"monitoring-blackbox-1\", \"\", \"\")) unless on (name) (time() - container_last_seen < 60)",
                "instant": true,
                "range": false,
                "intervalMs": 15000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        -1
                      ]
                    }
                  }
                ]
              }

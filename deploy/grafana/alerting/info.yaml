            "description": "Early warning for 'Disk almost full'.",
            "runbook": "1. `docker builder prune -af` and `docker image prune -af` usually free enough; otherwise follow 'Disk almost full'.",
            "value": "{{ with $values.A }}Used: {{ humanizePercentage .Value }}{{ end }}",
            "dashboard_url": "https://grafana.vinisaporto.de/d/docker-host"

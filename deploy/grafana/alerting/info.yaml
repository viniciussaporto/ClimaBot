            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "ced6krlr4hgxsb",
              "model": {
                "refId": "A",
                "expr": "max(container_fs_usage_bytes{id=\"/\",device=~\"/dev/(sd|vd|xvd|nvme|hd)[a-z0-9]+\"} / container_fs_limit_bytes{id=\"/\",device=~\"/dev/(sd|vd|xvd|nvme|hd)[a-z0-9]+\"})",
                "instant": true,
                "range": false,
                "intervalMs": 15000,
                "maxDataPoints": 43200

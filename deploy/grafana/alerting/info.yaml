    {
      "orgId": 1,
      "name": "Server · info",
      "folder": "Infrastructure Metrics",
      "interval": "5m",
      "rules": [
        {
          "uid": "srv-cpu-high",
          "title": "Server CPU high",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "ced6krlr4hgxsb",
              "model": {
                "refId": "A",
                "expr": "sum(rate(container_cpu_usage_seconds_total{id=\"/\"}[5m])) / max(machine_cpu_cores)",
                "instant": true,
                "range": false,
                "intervalMs": 15000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0.9
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "15m",
          "labels": {
            "severity": "info"
          },
          "annotations": {
            "summary": "Server CPU above 90% for 15 minutes",
            "description": "Everything on the server slows down: price checks, the website, Grafana.",
            "runbook": "1. 'Docker Host & Containers' or `docker stats --no-stream` for the busiest container.\n2. Usually a scraper browser spinning on a page: restart it.\n3. Nothing in Docker: `top` for host processes (a stuck backup or update).",
            "value": "{{ with $values.A }}CPU: {{ humanizePercentage .Value }}{{ end }}",
            "dashboard_url": "https://grafana.vinisaporto.de/d/docker-host"
          },
          "notification_settings": {
            "receiver": "Discord (info)",
            "group_by": [
              "alertname",
              "grafana_folder"
            ],
            "repeat_interval": "24h"
          },
          "isPaused": false
        },
        {
          "uid": "srv-memory-high",
          "title": "Server memory high",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "ced6krlr4hgxsb",
              "model": {
                "refId": "A",
                "expr": "max(container_memory_working_set_bytes{id=\"/\"}) / max(machine_memory_bytes)",
                "instant": true,
                "range": false,
                "intervalMs": 15000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0.85
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "15m",
          "labels": {
            "severity": "info"
          },
          "annotations": {
            "summary": "Server memory above 85% for 15 minutes",
            "description": "Early warning for 'Server out of memory'.",
            "runbook": "1. Same steps as 'Server out of memory', without the hurry.",
            "value": "{{ with $values.A }}Used: {{ humanizePercentage .Value }}{{ end }}",
            "dashboard_url": "https://grafana.vinisaporto.de/d/docker-host"
          },
          "notification_settings": {
            "receiver": "Discord (info)",
            "group_by": [
              "alertname",
              "grafana_folder"
            ],
            "repeat_interval": "24h"
          },
          "isPaused": false
        },
        {
          "uid": "srv-disk-high",

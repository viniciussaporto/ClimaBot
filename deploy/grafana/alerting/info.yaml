            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "ced6krlr4hgxsb",
              "model": {
                "refId": "A",
                "expr": "max by (name) (changes(container_start_time_seconds{name!=\"\"}[15m]))",

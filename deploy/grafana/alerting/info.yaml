          "noDataState": "OK",
          "execErrState": "Error",
          "for": "0s",
          "labels": {
            "severity": "info"
          },
          "annotations": {
            "summary": "{{ $labels.name }} restarted 3+ times in 15 minutes",
            "description": "It keeps exiting and being restarted.",
            "runbook": "1. `docker logs {{ $labels.name }} --tail 100` for why it exits.\n2. `docker inspect {{ $labels.name }} | grep -E 'ExitCode|OOMKilled'`: exit code 137 or OOMKilled true means memory.\n3. Started after an update: roll back that service's last change.",
            "value": "{{ with $values.A }}Restarts in 15 min: {{ printf \"%.0f\" .Value }}{{ end }}",
            "dashboard_url": "https://grafana.vinisaporto.de/d/docker-host"
          },
          "notification_settings": {
            "receiver": "Discord (info)",
            "group_by": [
              "alertname",
              "grafana_folder"
            ],
            "repeat_interval": "24h"
          },
          "isPaused": false
        },
        {
          "uid": "srv-container-oom",
          "title": "Container ran out of memory",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "ced6krlr4hgxsb",
              "model": {
                "refId": "A",
                "expr": "sum by (name) (increase(container_oom_events_total{name!=\"\"}[15m]))",
                "instant": true,
                "range": false,
                "intervalMs": 15000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0.0
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "0s",
          "labels": {
            "severity": "info"
          },
          "annotations": {
            "summary": "{{ $labels.name }} was killed for running out of memory",
            "description": "The kernel OOM-killed a process in it (it may have restarted fine).",
            "runbook": "1. `docker stats --no-stream {{ $labels.name }}` against its limit.\n2. Once: ignore. Repeats: raise its memory limit or look for a leak on 'Docker Host & Containers'.",
            "dashboard_url": "https://grafana.vinisaporto.de/d/docker-host"
          },
          "notification_settings": {
            "receiver": "Discord (info)",
            "group_by": [
              "alertname",
              "grafana_folder"
            ],
            "repeat_interval": "24h"
          },
          "isPaused": false
        },
        {

                "expr": "min((probe_ssl_earliest_cert_expiry - time()) / 86400)",
                "instant": true,
                "range": false,
                "intervalMs": 15000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "lt",
                      "params": [
                        21
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "6h",
          "labels": {
            "severity": "info"
          },
          "annotations": {
            "summary": "A certificate expires in less than 21 days",
            "description": "Edge certificates normally renew around 30 days before expiry. Early warning for 'TLS certificate expires within 7 days'.",
            "runbook": "1. Same checks as 'TLS certificate expires within 7 days', without the hurry.",
            "value": "{{ with $values.A }}Expires in: {{ printf \"%.1f days\" .Value }}{{ end }}",
